<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 780" width="100%" height="100%" style="background:#0d1117;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="100%" stop-color="#161b22"/>
    </linearGradient>
    <linearGradient id="card-grad-1" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1c2128"/>
      <stop offset="100%" stop-color="#161b22"/>
    </linearGradient>
    <linearGradient id="blue-accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#388bfd"/>
      <stop offset="100%" stop-color="#58a6ff"/>
    </linearGradient>
    <linearGradient id="green-accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#238636"/>
      <stop offset="100%" stop-color="#2ea043"/>
    </linearGradient>
    <linearGradient id="purple-accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8957e5"/>
      <stop offset="100%" stop-color="#a371f7"/>
    </linearGradient>
    <linearGradient id="amber-accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#d29922"/>
      <stop offset="100%" stop-color="#e3b341"/>
    </linearGradient>
    <linearGradient id="cyan-accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1f6feb"/>
      <stop offset="100%" stop-color="#39c5cf"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#58a6ff"/>
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#3fb950"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="1200" height="780" fill="url(#bg-grad)"/>

  <!-- Subtle grid pattern -->
  <g opacity="0.08" stroke="#ffffff" stroke-width="1">
    <line x1="0" y1="130" x2="1200" y2="130"/>
    <line x1="0" y1="290" x2="1200" y2="290"/>
    <line x1="0" y1="450" x2="1200" y2="450"/>
    <line x1="0" y1="610" x2="1200" y2="610"/>
    <line x1="300" y1="0" x2="300" y2="780"/>
    <line x1="600" y1="0" x2="600" y2="780"/>
    <line x1="900" y1="0" x2="900" y2="780"/>
  </g>

  <!-- Header Section -->
  <g transform="translate(50, 40)">
    <rect x="0" y="0" width="7" height="48" fill="url(#blue-accent)" rx="3"/>
    <text x="24" y="22" fill="#ffffff" font-size="24" font-weight="700" letter-spacing="-0.3">ClimateChain Evidence Ledger (CCEL)</text>
    <text x="24" y="44" fill="#8b949e" font-size="14" font-weight="400">Independent Cryptographic Evidence Verification Ledger for Environmental Claims · System Architecture</text>
    <rect x="940" y="8" width="160" height="28" rx="14" fill="#21262d" stroke="#30363d"/>
    <circle cx="956" cy="22" r="4" fill="#3fb950"/>
    <text x="968" y="27" fill="#c9d1d9" font-size="12" font-weight="600">Sepolia: 0xb1ce...210f</text>
  </g>

  <!-- ═════════ LAYER 1: DATA INGESTION & COG FETCH ═════════ -->
  <g transform="translate(50, 115)">
    <rect width="1100" height="110" rx="10" fill="url(#card-grad-1)" stroke="#30363d" stroke-width="1.5"/>
    <rect x="0" y="0" width="1100" height="4" fill="url(#blue-accent)" rx="2"/>
    
    <!-- Title -->
    <text x="24" y="26" fill="#58a6ff" font-size="12" font-weight="700" letter-spacing="1">1 // EARTH OBSERVATION DATA &amp; STAC CENSUS LAYER</text>
    <text x="890" y="26" fill="#8b949e" font-size="11" font-weight="500">Public &amp; Cloud-Native</text>

    <!-- Sub-boxes -->
    <!-- Box 1.1 -->
    <rect x="24" y="38" width="245" height="58" rx="6" fill="#0d1117" stroke="#21262d"/>
    <text x="36" y="58" fill="#e6edf3" font-size="13" font-weight="600">Copernicus Sentinel-2 L2A</text>
    <text x="36" y="76" fill="#8b949e" font-size="11">AWS Open Data Cloud-Optimized GeoTIFF</text>
    <text x="36" y="88" fill="#58a6ff" font-size="10" font-family="monospace">B8A (NIR), B12 (SWIR2), SCL, TCI</text>

    <!-- Box 1.2 -->
    <rect x="285" y="38" width="250" height="58" rx="6" fill="#0d1117" stroke="#21262d"/>
    <text x="297" y="58" fill="#e6edf3" font-size="13" font-weight="600">HTTP Range-Request Clipper</text>
    <text x="297" y="76" fill="#8b949e" font-size="11">Windowed sub-scene extraction</text>
    <text x="297" y="88" fill="#79c0ff" font-size="10" font-family="monospace">Zero gigabyte raster downloading</text>

    <!-- Box 1.3 -->
    <rect x="550" y="38" width="255" height="58" rx="6" fill="#0d1117" stroke="#21262d"/>
    <text x="562" y="58" fill="#e6edf3" font-size="13" font-weight="600">Multi-Catalog STAC Census</text>
    <text x="562" y="76" fill="#8b949e" font-size="11">Paginated Earth Search API query</text>
    <text x="562" y="88" fill="#3fb950" font-size="10" font-family="monospace">Pre-fire / Active / Containment scenes</text>

    <!-- Box 1.4 -->
    <rect x="820" y="38" width="255" height="58" rx="6" fill="#0d1117" stroke="#21262d"/>
    <text x="832" y="58" fill="#e6edf3" font-size="13" font-weight="600">Tile Seamline Bounding</text>
    <text x="832" y="76" fill="#8b949e" font-size="11">Single-tile UTM 35N containment</text>
    <text x="832" y="88" fill="#d29922" font-size="10" font-family="monospace">MGRS Tile 35SMC · 58,325.1 ha</text>
  </g>

  <!-- Flow Arrow 1 to 2 -->
  <path d="M 600 225 L 600 248" stroke="#58a6ff" stroke-width="2" stroke-dasharray="4,4" marker-end="url(#arrow)"/>

  <!-- ═════════ LAYER 2: REMOTE SENSING & RADIOMETRIC PIPELINE ═════════ -->
  <g transform="translate(50, 252)">
    <rect width="1100" height="110" rx="10" fill="url(#card-grad-1)" stroke="#30363d" stroke-width="1.5"/>
    <rect x="0" y="0" width="1100" height="4" fill="url(#amber-accent)" rx="2"/>

    <!-- Title -->
    <text x="24" y="26" fill="#e3b341" font-size="12" font-weight="700" letter-spacing="1">2 // RADIOMETRIC CALIBRATION &amp; SENSITIVITY ENGINE (packages/cli/ccel_cli/)</text>
    <text x="880" y="26" fill="#8b949e" font-size="11" font-weight="500">Empirical Remote Sensing</text>

    <!-- Sub-boxes -->
    <!-- Box 2.1 -->
    <rect x="24" y="38" width="250" height="58" rx="6" fill="#0d1117" stroke="#21262d"/>
    <text x="36" y="58" fill="#e6edf3" font-size="13" font-weight="600">ESA PB 05.xx Calibration</text>
    <text x="36" y="76" fill="#8b949e" font-size="11">BOA_ADD_OFFSET = -1000 applied</text>
    <text x="36" y="88" fill="#f0883e" font-size="10" font-family="monospace">Prevents -23.6% burn area skew</text>

    <!-- Box 2.2 -->
    <rect x="290" y="38" width="250" height="58" rx="6" fill="#0d1117" stroke="#21262d"/>
    <text x="302" y="58" fill="#e6edf3" font-size="13" font-weight="600">Calibrated dNBR Formulation</text>
    <text x="302" y="76" fill="#8b949e" font-size="11">Difference Normalized Burn Ratio</text>
    <text x="302" y="88" fill="#e3b341" font-size="10" font-family="monospace">dNBR = NBR(pre) - NBR(post)</text>

    <!-- Box 2.3 -->
    <rect x="555" y="38" width="255" height="58" rx="6" fill="#0d1117" stroke="#21262d"/>
    <text x="567" y="58" fill="#e6edf3" font-size="13" font-weight="600">6-Tier Sensitivity Curve</text>
    <text x="567" y="76" fill="#8b949e" font-size="11">USGS burn severity thresholds</text>
    <text x="567" y="88" fill="#79c0ff" font-size="10" font-family="monospace">0.10, 0.15, 0.20, 0.27, 0.44, 0.66</text>

    <!-- Box 2.4 -->
    <rect x="825" y="38" width="250" height="58" rx="6" fill="#0d1117" stroke="#21262d"/>
    <text x="837" y="58" fill="#e6edf3" font-size="13" font-weight="600">1-Year Recovery Scope Gate</text>
    <text x="837" y="76" fill="#8b949e" font-size="11">Anniversary pass (25 June 2026)</text>
    <text x="837" y="88" fill="#3fb950" font-size="10" font-family="monospace">Distinguishes shrub from tree regrowth</text>
  </g>

  <!-- Flow Arrow 2 to 3 -->
  <path d="M 600 362 L 600 385" stroke="#58a6ff" stroke-width="2" stroke-dasharray="4,4" marker-end="url(#arrow)"/>

  <!-- ═════════ LAYER 3: VERIFICATION GATEKEEPER & CRYPTOGRAPHY ═════════ -->
  <g transform="translate(50, 389)">
    <rect width="1100" height="110" rx="10" fill="url(#card-grad-1)" stroke="#30363d" stroke-width="1.5"/>
    <rect x="0" y="0" width="1100" height="4" fill="url(#purple-accent)" rx="2"/>

    <!-- Title -->
    <text x="24" y="26" fill="#bc8cff" font-size="12" font-weight="700" letter-spacing="1">3 // AUTOMATED QUALITY GATEKEEPER &amp; DETERMINISTIC CRYPTOGRAPHY</text>
    <text x="895" y="26" fill="#8b949e" font-size="11" font-weight="500">RFC 8785 + RFC 6962</text>

    <!-- Sub-boxes -->
    <!-- Box 3.1 -->
    <rect x="24" y="38" width="250" height="58" rx="6" fill="#0d1117" stroke="#21262d"/>
    <text x="36" y="58" fill="#e6edf3" font-size="13" font-weight="600">RFC 8785 Canonical JSON</text>
    <text x="36" y="76" fill="#8b949e" font-size="11">Strict whitespace &amp; UTF-16 sorting</text>
    <text x="36" y="88" fill="#a371f7" font-size="10" font-family="monospace">Cross-language (Python, TS, EVM)</text>

    <!-- Box 3.2 -->
    <rect x="290" y="38" width="250" height="58" rx="6" fill="#0d1117" stroke="#21262d"/>
    <text x="302" y="58" fill="#e6edf3" font-size="13" font-weight="600">RFC 6962 Binary Merkle Tree</text>
    <text x="302" y="76" fill="#8b949e" font-size="11">Domain separated 0x00 / 0x01 prefixes</text>
    <text x="302" y="88" fill="#bc8cff" font-size="10" font-family="monospace">packageHash + merkleRoot digest</text>

    <!-- Box 3.3 -->
    <rect x="555" y="38" width="255" height="58" rx="6" fill="#0d1117" stroke="#21262d"/>
    <text x="567" y="58" fill="#e6edf3" font-size="13" font-weight="600">5 Automated Quality Gates</text>
    <text x="567" y="76" fill="#8b949e" font-size="11">Cryptographic &amp; scientific invariants</text>
    <text x="567" y="88" fill="#3fb950" font-size="10" font-family="monospace">PASS, WARN, or NEEDS_EVIDENCE</text>

    <!-- Box 3.4 -->
    <rect x="825" y="38" width="250" height="58" rx="6" fill="#0d1117" stroke="#21262d"/>
    <text x="837" y="58" fill="#e6edf3" font-size="13" font-weight="600">Deterministic Parity Test</text>
    <text x="837" y="76" fill="#8b949e" font-size="11">Dual-language verification harness</text>
    <text x="837" y="88" fill="#79c0ff" font-size="10" font-family="monospace">38 pytest + 7 Vitest vector tests</text>
  </g>

  <!-- Flow Arrow 3 to 4 -->
  <path d="M 600 499 L 600 522" stroke="#58a6ff" stroke-width="2" stroke-dasharray="4,4" marker-end="url(#arrow)"/>

  <!-- ═════════ LAYER 4: ETHEREUM SEPOLIA SMART CONTRACTS ═════════ -->
  <g transform="translate(50, 526)">
    <rect width="1100" height="110" rx="10" fill="url(#card-grad-1)" stroke="#30363d" stroke-width="1.5"/>
    <rect x="0" y="0" width="1100" height="4" fill="url(#green-accent)" rx="2"/>

    <!-- Title -->
    <text x="24" y="26" fill="#3fb950" font-size="12" font-weight="700" letter-spacing="1">4 // ON-CHAIN ETHEREUM SEPOLIA REGISTRY (EvidenceRegistry.sol)</text>
    <text x="910" y="26" fill="#8b949e" font-size="11" font-weight="500">Immutable Audit DAG</text>

    <!-- Sub-boxes -->
    <!-- Box 4.1 -->
    <rect x="24" y="38" width="250" height="58" rx="6" fill="#0d1117" stroke="#21262d"/>
    <text x="36" y="58" fill="#e6edf3" font-size="13" font-weight="600">Selection Rule Registration</text>
    <text x="36" y="76" fill="#8b949e" font-size="11">Pre-registered vs post-hoc timing</text>
    <text x="36" y="88" fill="#58a6ff" font-size="10" font-family="monospace">registerSelectionRule()</text>

    <!-- Box 4.2 -->
    <rect x="290" y="38" width="250" height="58" rx="6" fill="#0d1117" stroke="#21262d"/>
    <text x="302" y="58" fill="#e6edf3" font-size="13" font-weight="600">Evidence Anchoring</text>
    <text x="302" y="76" fill="#8b949e" font-size="11">Append-only submission on-chain</text>
    <text x="302" y="88" fill="#3fb950" font-size="10" font-family="monospace">submit(pkgHash, merkleRoot, uri)</text>

    <!-- Box 4.3 -->
    <rect x="555" y="38" width="255" height="58" rx="6" fill="#0d1117" stroke="#21262d"/>
    <text x="567" y="58" fill="#e6edf3" font-size="13" font-weight="600">Watchdog Dispute Protocol</text>
    <text x="567" y="76" fill="#8b949e" font-size="11">Counter-evidence hash commitment</text>
    <text x="567" y="88" fill="#f85149" font-size="10" font-family="monospace">challengePackage() / resolve()</text>

    <!-- Box 4.4 -->
    <rect x="825" y="38" width="250" height="58" rx="6" fill="#0d1117" stroke="#21262d"/>
    <text x="837" y="58" fill="#e6edf3" font-size="13" font-weight="600">Supersession DAG &amp; Review</text>
    <text x="837" y="76" fill="#8b949e" font-size="11">Explicit cryptographic revision edge</text>
    <text x="837" y="88" fill="#3fb950" font-size="10" font-family="monospace">supersede() &amp; review() APPROVED</text>
  </g>

  <!-- Flow Arrow 4 to 5 -->
  <path d="M 600 636 L 600 659" stroke="#58a6ff" stroke-width="2" stroke-dasharray="4,4" marker-end="url(#arrow)"/>

  <!-- ═════════ LAYER 5: CLIENT & PRESENTATION ═════════ -->
  <g transform="translate(50, 663)">
    <rect width="1100" height="85" rx="10" fill="url(#card-grad-1)" stroke="#30363d" stroke-width="1.5"/>
    <rect x="0" y="0" width="1100" height="4" fill="url(#cyan-accent)" rx="2"/>

    <!-- Title -->
    <text x="24" y="24" fill="#39c5cf" font-size="12" font-weight="700" letter-spacing="1">5 // CLIENT EXPLORER &amp; EMBEDDABLE COMPONENTS (packages/web/)</text>
    <text x="895" y="24" fill="#8b949e" font-size="11" font-weight="500">Editorial UI &amp; Web Component</text>

    <!-- Sub-boxes -->
    <rect x="24" y="34" width="250" height="40" rx="5" fill="#0d1117" stroke="#21262d"/>
    <text x="36" y="52" fill="#e6edf3" font-size="12" font-weight="600">FT / Bloomberg Editorial Theme</text>
    <text x="36" y="66" fill="#8b949e" font-size="10">High-contrast salmon paper styling</text>

    <rect x="290" y="34" width="250" height="40" rx="5" fill="#0d1117" stroke="#21262d"/>
    <text x="302" y="52" fill="#e6edf3" font-size="12" font-weight="600">Interactive Leaflet Overlays</text>
    <text x="302" y="66" fill="#8b949e" font-size="10">Pre/post composite &amp; burn maps</text>

    <rect x="555" y="34" width="255" height="40" rx="5" fill="#0d1117" stroke="#21262d"/>
    <text x="567" y="52" fill="#e6edf3" font-size="12" font-weight="600">1-Byte WebCrypto Tamper Sim</text>
    <text x="567" y="66" fill="#8b949e" font-size="10">Real-time Merkle integrity validation</text>

    <rect x="825" y="34" width="250" height="40" rx="5" fill="#0d1117" stroke="#21262d"/>
    <text x="837" y="52" fill="#e6edf3" font-size="12" font-weight="600">&lt;climatechain-badge&gt;</text>
    <text x="837" y="66" fill="#8b949e" font-size="10">Standalone embeddable Web Component</text>
  </g>
</svg>
